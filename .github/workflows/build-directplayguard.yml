name: Build Direct Play Guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-directplayguard.yml"
      - "Jellyfin.Plugin.DirectPlayGuard/source/**"
      - "Jellyfin.Plugin.DirectPlayGuard/patches/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine next plugin version
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("jellyfin-directplayguard-manifest.json")
          current = "1.0.0.0"

          if manifest_path.exists():
              data = json.loads(manifest_path.read_text(encoding="utf-8"))
              versions = data[0].get("versions", []) if data else []
              if versions:
                  current = versions[0]["version"]

          parts = [int(x) for x in current.split(".")]
          if len(parts) != 4:
              raise SystemExit(f"Unexpected plugin version: {current}")

          parts[3] += 1
          next_version = ".".join(str(x) for x in parts)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PLUGIN_VERSION={next_version}\n")

          print(f"Current version: {current}")
          print(f"Next version:    {next_version}")
          PY

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat Jellyfin.Plugin.DirectPlayGuard/source/source.b64.part* > /tmp/directplayguard-source.b64
          base64 --decode /tmp/directplayguard-source.b64 > /tmp/directplayguard-source.zip
          rm -rf /tmp/directplayguard-src
          mkdir -p /tmp/directplayguard-src
          unzip -q /tmp/directplayguard-source.zip -d /tmp/directplayguard-src
          test -f /tmp/directplayguard-src/Jellyfin.Plugin.DirectPlayGuard/Jellyfin.Plugin.DirectPlayGuard.csproj

      - name: Install robust Jellyfin Web injection patch
        shell: bash
        run: |
          set -euo pipefail
          cp Jellyfin.Plugin.DirectPlayGuard/patches/WebInjectionStartupFilter.cs \
            /tmp/directplayguard-src/Jellyfin.Plugin.DirectPlayGuard/Web/WebInjectionStartupFilter.cs

      - name: Apply Jellyfin 12 playback error fix and version
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["PLUGIN_VERSION"]
          root = Path("/tmp/directplayguard-src/Jellyfin.Plugin.DirectPlayGuard")

          csproj = root / "Jellyfin.Plugin.DirectPlayGuard.csproj"
          project = csproj.read_text(encoding="utf-8")
          project = re.sub(r"<Version>[^<]+</Version>", f"<Version>{version}</Version>", project)
          project = re.sub(r"<AssemblyVersion>[^<]+</AssemblyVersion>", f"<AssemblyVersion>{version}</AssemblyVersion>", project)
          project = re.sub(r"<FileVersion>[^<]+</FileVersion>", f"<FileVersion>{version}</FileVersion>", project)
          csproj.write_text(project, encoding="utf-8")

          controller = root / "Api" / "ClientController.cs"
          source = controller.read_text(encoding="utf-8")
          needle = """  try {
              const originalOpen = XMLHttpRequest.prototype.open;
          """

          patch = r'''  function patchPlaybackErrorDialog(dialog) {
            if (!dialog || dialog.dataset.directPlayGuardPatched === '1') return false;

            const titleEl = dialog.querySelector('.formDialogHeaderTitle');
            const textEl = dialog.querySelector('.text');
            if (!titleEl || !textEl) return false;

            const titleText = (titleEl.textContent || '').trim().toLowerCase();
            const bodyText = (textEl.textContent || '').trim().toLowerCase();

            const looksLikePlaybackError =
              titleText === 'playback error' || titleText.includes('playback');

            const looksLikeCompatibilityFailure =
              bodyText.includes('not supported by this client') ||
              bodyText.includes('not compatible with the media') ||
              bodyText.includes("isn't compatible with the media") ||
              bodyText.includes('not sending a compatible media format');

            if (!looksLikePlaybackError || !looksLikeCompatibilityFailure) return false;

            dialog.dataset.directPlayGuardPatched = '1';
            titleEl.textContent = cfg.title || 'Playback not supported on this device';
            textEl.textContent = '';

            const message = document.createElement('p');
            message.textContent = cfg.message || 'This server does not transcode media. Use a compatible Jellyfin app and Original/Maximum playback quality.';
            message.style.cssText = 'margin:0 0 16px;line-height:1.55';
            textEl.appendChild(message);

            if (cfg.apps) {
              const apps = document.createElement('div');
              apps.textContent = cfg.apps;
              apps.style.cssText = 'white-space:pre-wrap;line-height:1.55;margin:0 0 16px;padding:12px 14px;border-radius:8px;background:rgba(255,255,255,.07)';
              textEl.appendChild(apps);
            }

            if (cfg.helpUrl) {
              const link = document.createElement('a');
              link.textContent = 'Get recommended Jellyfin apps';
              link.href = cfg.helpUrl;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.style.cssText = 'display:inline-block;margin-top:2px;text-decoration:none;font-weight:600';
              textEl.appendChild(link);
            }

            const button = dialog.querySelector('.btnOption');
            if (button) button.textContent = 'Close';
            return true;
          }

          function patchExistingPlaybackDialogs(root) {
            try {
              if (root && root.matches && root.matches('.formDialog')) patchPlaybackErrorDialog(root);
              const dialogs = (root || document).querySelectorAll
                ? (root || document).querySelectorAll('.formDialog')
                : [];
              for (const dialog of dialogs) patchPlaybackErrorDialog(dialog);
            } catch (_) { }
          }

          try {
            const startDialogObserver = function () {
              patchExistingPlaybackDialogs(document);
              if (!document.body) return;

              const observer = new MutationObserver(function (mutations) {
                for (const mutation of mutations) {
                  for (const node of mutation.addedNodes || []) {
                    if (node && node.nodeType === 1) patchExistingPlaybackDialogs(node);
                  }
                }
              });

              observer.observe(document.body, { childList: true, subtree: true });
            };

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', startDialogObserver, { once: true });
            } else {
              startDialogObserver();
            }
          } catch (_) { }

          '''

          if "function patchPlaybackErrorDialog" not in source:
              if needle not in source:
                  raise SystemExit("Could not find ClientController insertion point")
              source = source.replace(needle, patch + needle, 1)

          controller.write_text(source, encoding="utf-8")
          print(f"Prepared Direct Play Guard {version}")
          PY

      - name: Build Jellyfin 12 plugin
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore /tmp/directplayguard-src/Jellyfin.Plugin.DirectPlayGuard/Jellyfin.Plugin.DirectPlayGuard.csproj
          dotnet publish /tmp/directplayguard-src/Jellyfin.Plugin.DirectPlayGuard/Jellyfin.Plugin.DirectPlayGuard.csproj \
            -c Release \
            -o /tmp/directplayguard-publish
          test -f /tmp/directplayguard-publish/Jellyfin.Plugin.DirectPlayGuard.dll

      - name: Package plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Jellyfin.Plugin.DirectPlayGuard/release
          ZIP="Jellyfin.Plugin.DirectPlayGuard/release/DirectPlayGuard_${PLUGIN_VERSION}.zip"
          rm -f "$ZIP"
          cd /tmp/directplayguard-publish
          zip -j "$GITHUB_WORKSPACE/$ZIP" Jellyfin.Plugin.DirectPlayGuard.dll
          echo "PLUGIN_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Generate Jellyfin repository manifest
        shell: bash
        run: |
          set -euo pipefail
          CHECKSUM="$(md5sum "$PLUGIN_ZIP" | awk '{print toupper($1)}')"
          TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          SOURCE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${PLUGIN_ZIP}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          python3 - "$PLUGIN_VERSION" "$CHECKSUM" "$TIMESTAMP" "$SOURCE_URL" "$SHORT_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          version, checksum, timestamp, source_url, short_sha = sys.argv[1:6]
          manifest_path = Path("jellyfin-directplayguard-manifest.json")

          plugin = {
              "guid": "b7c890c3-0f38-4fd8-a925-3a8b79e2a4c1",
              "name": "Direct Play Guard",
              "overview": "Disables Jellyfin transcoding and guides users toward Direct Play compatible apps.",
              "description": "Jellyfin 12 plugin that disables video and audio transcoding, optionally disables remuxing for strict Direct Play, restores original user permissions when disabled, and shows a custom unsupported-client message in Jellyfin Web.",
              "owner": "St3venSmith",
              "category": "Utilities",
              "versions": []
          }

          old_versions = []
          if manifest_path.exists():
              old_manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              if old_manifest:
                  old_versions = old_manifest[0].get("versions", [])

          new_version = {
              "version": version,
              "changelog": f"Automated Direct Play Guard build from {short_sha}.",
              "targetAbi": "12.0.0.0",
              "sourceUrl": source_url,
              "timestamp": timestamp,
              "checksum": checksum
          }

          plugin["versions"] = [new_version] + [
              item for item in old_versions
              if item.get("version") != version
          ]

          manifest_path.write_text(
              json.dumps([plugin], indent=2) + "\n",
              encoding="utf-8"
          )

          print(f"Published manifest entry {version}")
          PY

      - name: Publish installable package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PLUGIN_ZIP" jellyfin-directplayguard-manifest.json
          git commit -m "Build Direct Play Guard $PLUGIN_VERSION"
          git push
